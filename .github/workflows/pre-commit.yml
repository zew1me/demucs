name: pre-commit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # torch 2.4.1 does not ship wheels for the runner's default Python.
        run: uv sync --locked --python 3.11 --all-groups

      - name: Run pre-commit
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

      - name: Test audio analysis
        run: uv run --locked python -m unittest discover -s client/tests
